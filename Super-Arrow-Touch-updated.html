<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#4338CA"><meta name="description" content="Super Arrow Touch arrow puzzle game">
<title>Super Arrow Touch</title>
<style>
:root{--a:#4338CA;--b:#6D28D9;--ink:#1E1B4B;--line:#E7E5F5}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,sans-serif;color:var(--ink);background:#fff;user-select:none;touch-action:manipulation}#app{height:100%;display:flex;flex-direction:column;align-items:center;padding:8px}header{width:100%;max-width:520px;display:flex;align-items:center;justify-content:space-between;gap:5px;padding:4px 0 8px}.brand{font-weight:900;font-size:clamp(13px,3.8vw,20px);white-space:nowrap}.brand span{color:var(--a)}.hud{display:flex;align-items:center;gap:5px;flex-wrap:wrap;justify-content:flex-end;font-size:11px;font-weight:800}.pill{background:#F0EEFF;color:var(--a);padding:5px 7px;border-radius:20px;white-space:nowrap}#board-wrap{width:100%;max-width:520px;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}#board{width:100%;height:100%;max-height:70vh;display:grid;gap:5px}.cell{position:relative;min-height:0}.arrow{position:absolute;inset:2px;background:linear-gradient(150deg,var(--a),var(--b));border-radius:12px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 #211b6840;transition:transform .12s,opacity .3s;touch-action:manipulation}.arrow svg{width:54%;height:54%}.arrow.wrong{background:#dc2626;animation:shake .3s}.arrow.gone{opacity:0;pointer-events:none}.arrow.hint{outline:4px solid #f59e0b;animation:pulse .6s 3}.arrow .ring{position:absolute;inset:-2px;border:4px solid #fbbf24;border-radius:50%;animation:blast .35s forwards;pointer-events:none}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}@keyframes pulse{50%{filter:brightness(1.4);scale:1.06}}@keyframes blast{to{scale:2.3;opacity:0}}#controls{width:100%;max-width:520px;display:flex;justify-content:center;gap:7px;padding:8px 0 3px;flex-wrap:wrap}.tool,.btn{border:0;border-radius:30px;padding:10px 13px;font-weight:800;background:#efedff;color:var(--a);box-shadow:0 3px 0 #d8d5f5;font-size:12px}.tool:disabled{opacity:.45}.btn{background:linear-gradient(150deg,var(--a),var(--b));color:white;padding:12px 22px;font-size:15px}#toast{position:fixed;z-index:50;top:12px;left:50%;transform:translate(-50%,-50px);opacity:0;background:var(--ink);color:white;border-radius:25px;padding:9px 15px;font-size:13px;font-weight:800;transition:.25s;max-width:95vw;white-space:nowrap}#toast.show{opacity:1;transform:translate(-50%,0)}#overlay,#entry{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:18px;background:#1e1b4bd9;backdrop-filter:blur(3px)}#overlay.show{display:flex}.card{background:#fff;border-radius:24px;padding:26px 20px;width:min(90vw,360px);text-align:center;box-shadow:0 18px 45px #0003}.card h2{margin:0 0 8px}.card p{font-size:14px;color:#6b7280;line-height:1.5;margin:5px 0 17px}.card .btn{margin:4px}.small{font-size:11px;color:#8b85c4;margin-top:12px}#entry{display:flex;z-index:30;background:radial-gradient(circle,#fff,#ddd6fe 65%,#a78bfa);color:var(--ink);text-align:center}.entry-arrows{font-size:clamp(30px,9vw,48px);letter-spacing:5px;animation:entry 1.4s infinite alternate}.entry-title{font-size:clamp(25px,7vw,34px);font-weight:1000;margin:12px 0}.entry-sub{color:#6b7280;font-size:14px}@keyframes entry{to{transform:scale(1.08) rotate(3deg);filter:brightness(1.2)}}#app.shake{animation:shake .25s}
</style></head>
<body>
<div id="app">
<header><div class="brand"><span>➤</span> Super Arrow Touch</div><div class="hud"><span class="pill" id="level">Level 1</span><span class="pill" id="score">⭐ 0</span><span class="pill" id="coins">🪙 0</span><span class="pill" id="grenadeCount">💣 0</span><span id="hearts"></span></div></header>
<div id="board-wrap"><div id="board"></div></div>
<div id="controls"><button class="tool" id="grenadeBtn">💣 Grenade (0)</button><button class="tool" id="hintBtn">🧭 Hint (5 🪙)</button><button class="tool" id="skinBtn">🌈 Skin: Purple</button></div>
</div>
<div id="toast"></div>
<div id="overlay"><div class="card"><h2 id="overTitle">Level Complete!</h2><p id="overText"></p><div id="overButtons"></div></div></div>
<div id="entry"><div><div class="entry-arrows">⬆️ ➡️ ⬇️ ⬅️</div><div class="entry-title">SUPER ARROW TOUCH</div><p class="entry-sub">Socho • Sahi Arrow Chuno • Puzzle Jeeto!</p><button class="btn" id="play">▶ PLAY</button><div class="small">Progress isi browser mein save hogi.</div></div></div>
<script>
(()=>{'use strict';
const D={up:{x:0,y:-1,r:0},right:{x:1,y:0,r:90},down:{x:0,y:1,r:180},left:{x:-1,y:0,r:270}},DK=Object.keys(D),KEY='sat_save_v3';
const skins=[['#4338CA','#6D28D9','Purple'],['#0F766E','#14B8A6','Teal'],['#BE123C','#F43F5E','Pink'],['#B45309','#F59E0B','Gold'],['#1D4ED8','#38BDF8','Blue']];
const $=id=>document.getElementById(id),board=$('board'),toastEl=$('toast');let cols=6,rows=7,arrows=[],level=1,score=0,coins=0,grenades=0,lives=3,skin=0,busy=false,grenadeMode=false,ctx=null;
function sound(f=600,d=.09,type='triangle',delay=0){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume();let o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+delay;o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.12,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(ctx.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
function toast(s){toastEl.textContent=s;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),1400)}
function save(){try{localStorage.setItem(KEY,JSON.stringify({level,score,coins,grenades,skin}))}catch(e){}}
function load(){try{let d=JSON.parse(localStorage.getItem(KEY)||'null');if(d){level=Math.max(1,+d.level||1);score=Math.max(0,+d.score||0);coins=Math.max(0,+d.coins||0);grenades=Math.max(0,+d.grenades||0);skin=Math.max(0,Math.min(4,+d.skin||0))}}catch(e){}}
function k(x,y){return x+','+y}
function clearPath(x,y,dir,occ){let d=D[dir],xx=x+d.x,yy=y+d.y;while(xx>=0&&xx<cols&&yy>=0&&yy<rows){if(occ.has(k(xx,yy)))return false;xx+=d.x;yy+=d.y}return true}
function generate(lv){cols=Math.min(5+Math.floor(lv/2),8);rows=Math.min(6+Math.floor(lv/2),9);let cells=[];for(let y=0;y<rows;y++)for(let x=0;x<cols;x++)cells.push({x,y});let occ=new Set(),out=[],need=Math.min(8+lv*3,Math.floor(cols*rows*.62)),tries=0;while(out.length<need&&tries<need*100){tries++;let c=cells[Math.random()*cells.length|0],key=k(c.x,c.y);if(occ.has(key))continue;let ds=DK.filter(d=>clearPath(c.x,c.y,d,occ));if(!ds.length)continue;let dir=ds[Math.random()*ds.length|0];occ.add(key);out.push({...c,dir,id:Math.random().toString(36).slice(2),alive:true})}return out}
function svg(){return '<svg viewBox="0 0 24 24" fill="none"><path d="M12 3L12 21M12 3L6 9M12 3L18 9" stroke="white" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>'}
function applySkin(){document.documentElement.style.setProperty('--a',skins[skin][0]);document.documentElement.style.setProperty('--b',skins[skin][1]);$('skinBtn').textContent='🌈 Skin: '+skins[skin][2]}
function hud(){$('level').textContent='Level '+level;$('score').textContent='⭐ '+score;$('coins').textContent='🪙 '+coins;$('grenadeCount').textContent='💣 '+grenades;$('grenadeBtn').textContent=grenadeMode?'💣 Ab Arrow Chuno':'💣 Grenade ('+grenades+')';$('grenadeBtn').disabled=grenades<=0&&!grenadeMode;$('hearts').textContent='❤️'.repeat(lives)+'🩶'.repeat(3-lives);$('hintBtn').disabled=busy;save()}
function render(){board.style.gridTemplateColumns=`repeat(${cols},1fr)`;board.style.gridTemplateRows=`repeat(${rows},1fr)`;board.innerHTML='';let cells={};for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){let el=document.createElement('div');el.className='cell';el.style.gridColumn=x+1;el.style.gridRow=y+1;board.append(el);cells[k(x,y)]=el}arrows.forEach(a=>{let el=document.createElement('div');el.className='arrow';el.style.transform=`rotate(${D[a.dir].r}deg)`;el.innerHTML=svg();el.addEventListener('pointerdown',e=>{e.preventDefault();tap(a.id)});cells[k(a.x,a.y)].append(el);a.el=el})}
function start(lv){level=lv;lives=3;busy=false;grenadeMode=false;arrows=generate(lv);render();hud()}
function clearNow(a){let occ=new Set(arrows.filter(b=>b.alive).map(b=>k(b.x,b.y)));return clearPath(a.x,a.y,a.dir,occ)}
function remove(a,blast=false){if(!a||!a.alive)return;a.alive=false;if(a.el){if(blast){let ring=document.createElement('i');ring.className='ring';a.el.append(ring)}a.el.classList.add('gone');let d=D[a.dir];a.el.style.transform=`rotate(${d.r}deg) translate(${d.x*140}%,${d.y*140}%)`;setTimeout(()=>a.el?.remove(),330)}}
function tap(id){if(busy)return;let a=arrows.find(x=>x.id===id&&x.alive);if(!a)return;if(grenadeMode){blast(a);return}if(clearNow(a)){remove(a);sound(720);sound(980,.09,'triangle',.04);score+=10;coins++;hud();setTimeout(checkClear,350)}else{sound(180,.18,'sawtooth');$('app').classList.add('shake');setTimeout(()=>$('app').classList.remove('shake'),280);a.el.classList.add('wrong');setTimeout(()=>a.el?.classList.remove('wrong'),330);lives=Math.max(0,lives-1);hud();if(!lives)setTimeout(gameOver,250)}}
function blast(target){if(!grenades){grenadeMode=false;hud();toast('Grenade nahi hai');return}busy=true;grenades--;grenadeMode=false;let near=arrows.filter(a=>a.alive&&a!==target).sort((a,b)=>Math.hypot(a.x-target.x,a.y-target.y)-Math.hypot(b.x-target.x,b.y-target.y));let n=Math.min(near.length,3+(Math.random()*3|0)),victims=[target,...near.slice(0,n)];victims.forEach((a,i)=>setTimeout(()=>remove(a,true),i*25));score+=victims.length*5;coins+=Math.max(1,Math.floor(victims.length/2));sound(120,.2,'sawtooth');sound(80,.22,'sawtooth',.08);hud();toast('BOOM! '+victims.length+' Arrows toot gaye 💥');setTimeout(()=>{busy=false;checkClear()},450)}
function checkClear(){if(busy||arrows.some(a=>a.alive))return;busy=true;[523,659,784,1046].forEach((f,i)=>sound(f,.14,'triangle',i*.08));let done=level;coins+=10;let reward='Level reward: +10 Coins';if(done%10===0){grenades++;reward+=' aur +1 Grenade 💣'}hud();show('LEVEL COMPLETED! 🎉','Level '+done+' complete! Score: '+score+' • '+reward,[['NEXT LEVEL ▶',()=>{overlayOff();start(done+1)}],['REPLAY LEVEL',()=>{overlayOff();start(done)}]])}
function show(title,sub,buttons){$('overTitle').textContent=title;$('overText').textContent=sub;let box=$('overButtons');box.innerHTML='';buttons.forEach(([label,fn],i)=>{let b=document.createElement('button');b.className='btn';b.textContent=label;b.addEventListener('click',fn);box.append(b)});$('overlay').classList.add('show')}
function overlayOff(){$('overlay').classList.remove('show');busy=false}
function gameOver(){busy=true;sound(220,.22,'sawtooth');show('Game Over','Score: '+score+' • Level '+level+' tak pahunche',[['Isi Level Se Khelo',()=>{overlayOff();start(level)}],['Level 1 se shuru karo',()=>{overlayOff();level=1;score=0;coins=0;grenades=0;start(1)}]])}
$('grenadeBtn').onclick=()=>{if(busy)return;if(grenades<=0){toast('Grenade har 10th level par milega');return}grenadeMode=!grenadeMode;hud();toast(grenadeMode?'Blast ke liye ek Arrow chuno':'Grenade cancel')};
$('hintBtn').onclick=()=>{if(busy)return;let a=arrows.find(x=>x.alive&&clearNow(x));if(!a){toast('Abhi clear Arrow nahi mila');return}if(coins<5){toast('Hint ke liye 5 Coins chahiye');return}coins-=5;hud();a.el.classList.add('hint');toast('Hint: chamakta Arrow chuno');setTimeout(()=>a.el?.classList.remove('hint'),2000)};
$('skinBtn').onclick=()=>{skin=(skin+1)%skins.length;applySkin();save();toast('Skin: '+skins[skin][2])};
$('play').onclick=()=>{$('entry').style.display='none';start(level);try{ctx?.resume()}catch(e){}};
load();applySkin();start(level);
})();
</script></body></html>
