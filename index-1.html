<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="description" content="Super Arrow Touch is a simple arrow puzzle game.">
<meta name="theme-color" content="#4338CA">
<title>Super Arrow Touch</title>
<style>
  :root{
    --ink:#1E1B4B;
    --accent:#4338CA;
    --accent2:#6D28D9;
    --good:#22C55E;
    --bad:#EF4444;
    --heart:#F43F5E;
    --paper:#FFFFFF;
    --line:#E7E5F5;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--paper);
    font-family: ui-rounded, "SF Pro Rounded", "Segoe UI Rounded", "Nunito", system-ui, sans-serif;
    color:var(--ink);
    overflow:hidden;
    touch-action:manipulation;
    user-select:none;
  }
  #app{
    display:flex; flex-direction:column; align-items:center;
    height:100%; width:100%;
    padding: 10px 10px 16px;
  }
  header{
    width:100%; max-width:520px;
    display:flex; align-items:center; justify-content:space-between;
    padding: 4px 6px 10px;
  }
  .brand{
    font-weight:800; font-size:20px; letter-spacing:-0.02em;
    display:flex; align-items:center; gap:6px;
  }
  .brand .dot{color:var(--accent);}
  .hud{ display:flex; align-items:center; gap:14px; }
  .hearts{ display:flex; gap:4px; }
  .heart{ width:22px; height:22px; transition: transform .25s ease; }
  .heart.lost{ opacity:0.18; transform: scale(0.7) rotate(-8deg); }
  .score{
    font-weight:800; font-size:15px; background:var(--line);
    padding:5px 10px; border-radius:999px; color:var(--accent);
  }
  .level-tag{
    font-size:12px; font-weight:700; color:#8B85C4; text-transform:uppercase; letter-spacing:.08em;
  }
  #board-wrap{
    position:relative; width:100%; max-width:520px; flex:1;
    display:flex; align-items:center; justify-content:center;
  }
  #board{
    display:grid; gap: 6px;
    width:100%; height:100%;
    max-height:70vh;
  }
  .cell{
    position:relative; width:100%; height:100%;
  }
  .arrow{
    position:absolute; inset:2px;
    background: linear-gradient(160deg, var(--accent), var(--accent2));
    border-radius: 14px;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 3px 0 rgba(30,27,75,0.25), 0 6px 10px rgba(67,56,202,0.18);
    cursor:pointer;
    transition: transform .12s ease;
    will-change: transform, opacity;
  }
  .arrow:active{ transform: scale(0.92); }
  .arrow svg{ width:52%; height:52%; }
  .arrow.wrong{
    animation: shake .35s ease;
    background: linear-gradient(160deg, var(--bad), #B91C1C);
  }
  .arrow.gone{
    transition: transform .32s cubic-bezier(.4,0,.2,1), opacity .32s ease;
    opacity:0;
  }
  @keyframes shake{
    0%,100%{ transform: translateX(0); }
    20%{ transform: translateX(-6px); }
    40%{ transform: translateX(6px); }
    60%{ transform: translateX(-4px); }
    80%{ transform: translateX(4px); }
  }
  #overlay{
    position:fixed; inset:0; background:rgba(30,27,75,0.55);
    display:none; align-items:center; justify-content:center; z-index:10;
    backdrop-filter: blur(2px);
  }
  #overlay.show{ display:flex; }
  .card{
    background:var(--paper); border-radius:22px; padding:28px 26px;
    width:min(86vw, 340px); text-align:center;
    box-shadow: 0 20px 40px rgba(30,27,75,0.35);
  }
  .card h2{ margin:0 0 6px; font-size:24px; }
  .card p{ margin:4px 0 18px; color:#6B7280; font-size:14px; }
  .btn{
    display:inline-block; border:none; cursor:pointer;
    background: linear-gradient(160deg, var(--accent), var(--accent2));
    color:#fff; font-weight:800; font-size:15px;
    padding:12px 26px; border-radius:999px;
    box-shadow: 0 4px 0 rgba(30,27,75,0.25);
  }
  .btn:active{ transform: translateY(2px); box-shadow:none; }
  #toast{
    position:fixed; top:14px; left:50%; transform:translateX(-50%) translateY(-40px);
    background:var(--ink); color:#fff; font-weight:700; font-size:13px;
    padding:8px 16px; border-radius:999px; opacity:0; transition: all .3s ease; z-index:20;
    white-space:nowrap;
  }
  #toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
  #shake-root.shaking{ animation: rootshake .3s ease; }
  @keyframes rootshake{
    0%,100%{ transform: translateX(0); }
    25%{ transform: translateX(-4px); }
    75%{ transform: translateX(4px); }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><span class="dot">➤</span> Super Arrow Touch</div>
    <div class="hud">
      <div class="level-tag" id="levelTag">Level 1</div>
      <div class="score" id="score">0</div>
      <div class="hearts" id="hearts"></div>
    </div>
  </header>
  <div id="board-wrap">
    <div id="board" style="grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(7, 1fr);"></div>
  </div>
</div>

<div id="toast"></div>

<div id="overlay">
  <div class="card" id="overlayCard">
    <h2 id="overlayTitle">Game Over</h2>
    <p id="overlaySub">Score: 0</p>
    <button class="btn" id="overlayBtn">Phir Se Khelo</button>
    <div id="restartScratch" style="margin-top:12px; font-size:12px; color:#8B85C4; font-weight:700; cursor:pointer; text-decoration:underline;">Level 1 se shuru karo</div>
  </div>
</div>

<script>
(function(){
  const DIRS = {
    up:    {dx:0, dy:-1, rot:0},
    right: {dx:1, dy:0,  rot:90},
    down:  {dx:0, dy:1,  rot:180},
    left:  {dx:-1,dy:0,  rot:270}
  };
  const DIR_KEYS = Object.keys(DIRS);

  const boardEl = document.getElementById('board');
  const heartsEl = document.getElementById('hearts');
  const scoreEl = document.getElementById('score');
  const levelTagEl = document.getElementById('levelTag');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlaySub = document.getElementById('overlaySub');
  const overlayBtn = document.getElementById('overlayBtn');
  const toastEl = document.getElementById('toast');
  const appRoot = document.getElementById('app');

  let cols, rows, arrows, lives, score, level, busy;
  let resumeLevel = 1;

  // ---------- Sound ----------
  let actx = null;
  function ctx(){
    if(!actx){ actx = new (window.AudioContext || window.webkitAudioContext)(); }
    return actx;
  }
  function tone(freq, dur, type, startGain, when){
    const c = ctx();
    const t0 = c.currentTime + (when||0);
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(startGain||0.2, t0+0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.connect(gain).connect(c.destination);
    osc.start(t0);
    osc.stop(t0+dur+0.02);
  }
  function sfxSuccess(){ tone(720,0.09,'triangle',0.18); tone(980,0.09,'triangle',0.14,0.05); }
  function sfxFail(){ tone(180,0.18,'sawtooth',0.16); }
  function sfxHeart(){ tone(140,0.25,'square',0.14); }
  function sfxLevel(){ [523,659,784,1046].forEach((f,i)=> tone(f,0.14,'triangle',0.16, i*0.09)); }
  function sfxGameOver(){ [400,340,280,220].forEach((f,i)=> tone(f,0.22,'sawtooth',0.14, i*0.14)); }

  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(()=> toastEl.classList.remove('show'), 1100);
  }
  function shakeRoot(){
    appRoot.classList.add('shaking');
    setTimeout(()=> appRoot.classList.remove('shaking'), 300);
  }

  // ---------- Level setup ----------
  function gridSizeForLevel(lv){
    const c = Math.min(5 + Math.floor(lv/2), 8);
    const r = Math.min(6 + Math.floor(lv/2), 9);
    return {c, r};
  }
  function arrowCountForLevel(lv, cellCount){
    const target = 8 + lv*3;
    return Math.min(target, Math.floor(cellCount*0.62));
  }

  function key(x,y){ return x+','+y; }

  function pathClear(x, y, dirKey, occupiedSet){
    const d = DIRS[dirKey];
    let cx = x+d.dx, cy = y+d.dy;
    while(cx>=0 && cx<cols && cy>=0 && cy<rows){
      if(occupiedSet.has(key(cx,cy))) return false;
      cx += d.dx; cy += d.dy;
    }
    return true;
  }

  function generateLevel(lv){
    const size = gridSizeForLevel(lv);
    cols = size.c; rows = size.r;
    const cellCount = cols*rows;
    const need = arrowCountForLevel(lv, cellCount);

    const occupied = new Set();
    const placed = [];
    const allCells = [];
    for(let y=0;y<rows;y++) for(let x=0;x<cols;x++) allCells.push({x,y});

    let attempts = 0;
    while(placed.length < need && attempts < need*40){
      attempts++;
      const cell = allCells[Math.floor(Math.random()*allCells.length)];
      const ck = key(cell.x, cell.y);
      if(occupied.has(ck)) continue;
      const validDirs = DIR_KEYS.filter(d => pathClear(cell.x, cell.y, d, occupied));
      if(validDirs.length === 0) continue;
      const dir = validDirs[Math.floor(Math.random()*validDirs.length)];
      occupied.add(ck);
      placed.push({x:cell.x, y:cell.y, dir, id: placed.length+'_'+Date.now()+'_'+Math.random()});
    }
    return placed;
  }

  // ---------- Rendering ----------
  function arrowSVG(){
    return '<svg viewBox="0 0 24 24" fill="none"><path d="M12 3L12 21M12 3L6 9M12 3L18 9" stroke="white" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  function render(){
    boardEl.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    boardEl.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
    boardEl.innerHTML = '';
    const cellMap = {};
    for(let y=0;y<rows;y++){
      for(let x=0;x<cols;x++){
        const cellDiv = document.createElement('div');
        cellDiv.className = 'cell';
        cellDiv.style.gridColumn = (x+1);
        cellDiv.style.gridRow = (y+1);
        boardEl.appendChild(cellDiv);
        cellMap[key(x,y)] = cellDiv;
      }
    }
    arrows.forEach(a => {
      const el = document.createElement('div');
      el.className = 'arrow';
      el.style.transform = `rotate(${DIRS[a.dir].rot}deg)`;
      el.innerHTML = arrowSVG();
      el.dataset.id = a.id;
      el.addEventListener('pointerdown', () => onTap(a.id));
      cellMap[key(a.x,a.y)].appendChild(el);
      a.el = el;
    });
  }

  function renderHearts(){
    heartsEl.innerHTML = '';
    for(let i=0;i<3;i++){
      const wrap = document.createElement('div');
      wrap.className = 'heart' + (i < (3-lives) ? ' lost' : '');
      wrap.innerHTML = '<svg viewBox="0 0 24 24" fill="'+ (i < (3-lives) ? "#D1D5DB" : "#F43F5E") +'"><path d="M12 21s-7.5-4.8-10-9.3C0.3 8.1 2 4.5 5.6 4c2-.3 3.8.7 4.9 2.4C11.6 4.7 13.4 3.7 15.4 4c3.6.5 5.3 4.1 3.6 7.7C19.5 16.2 12 21 12 21z"/></svg>';
      heartsEl.appendChild(wrap);
    }
  }

  function updateHUD(){
    scoreEl.textContent = score;
    levelTagEl.textContent = 'Level ' + level;
    renderHearts();
  }

  // ---------- Game logic ----------
  function isClearNow(a){
    const occ = new Set(arrows.filter(x=>x.alive).map(x=>key(x.x,x.y)));
    return pathClear(a.x, a.y, a.dir, occ);
  }

  function onTap(id){
    if(busy) return;
    const a = arrows.find(x=>x.id===id && x.alive);
    if(!a) return;

    if(isClearNow(a)){
      a.alive = false;
      sfxSuccess();
      score += 10;
      updateHUD();
      const d = DIRS[a.dir];
      a.el.classList.add('gone');
      a.el.style.transform = `rotate(${d.rot}deg) translate(${d.dx*140}%, ${d.dy*140}%)`;
      setTimeout(()=>{ a.el && a.el.remove(); checkLevelClear(); }, 320);
    } else {
      sfxFail(); shakeRoot();
      a.el.classList.add('wrong');
      setTimeout(()=> a.el && a.el.classList.remove('wrong'), 350);
      lives -= 1;
      sfxHeart();
      updateHUD();
      if(lives <= 0){
        setTimeout(gameOver, 250);
      }
    }
  }

  function checkLevelClear(){
    if(arrows.some(a=>a.alive)) return;
    busy = true;
    sfxLevel();
    toast('Level Clear! 🎉');
    setTimeout(()=>{ level += 1; startLevel(level); busy=false; }, 700);
  }

  function startLevel(lv){
    arrows = generateLevel(lv).map(a => Object.assign(a, {alive:true}));
    render();
    updateHUD();
  }

  function gameOver(){
    sfxGameOver();
    resumeLevel = level;
    overlayTitle.textContent = 'Game Over';
    overlaySub.textContent = 'Score: ' + score + '  •  Level ' + level + ' tak pahunche';
    overlayBtn.textContent = 'Isi Level Se Shuru Karo';
    overlay.classList.add('show');
  }

  function newGame(){
    lives = 3; score = 0; level = resumeLevel; busy=false;
    overlay.classList.remove('show');
    startLevel(level);
  }

  function restartFromScratch(){
    resumeLevel = 1;
    newGame();
  }

  overlayBtn.addEventListener('click', newGame);
  document.getElementById('restartScratch').addEventListener('click', restartFromScratch);

  resumeLevel = 1;
  newGame();
})();
</script>
</body>
</html>
